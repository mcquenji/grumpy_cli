name: grumpy_cli
description: Typed command-line applications built on Grumpy modules and routing.
version: 0.1.0
publish_to: none
repository: https://github.com/necodeIT/grumpy_cli
environment:
  sdk: ^3.10.0
dependencies:
  args: ^2.7.0
  get_it: ^8.2.0
  grumpy:
    git:
      url: https://github.com/necodeIT/grumpy.git
  grumpy_annotations:
    git: https://github.com/necodeIT/grumpy_annotations.git
  grumpy_io:
    git: https://github.com/necodeIT/grumpy_io.git
  meta: ^1.17.0
  path: ^1.9.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.4
dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
